name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # ALTREX CODE targets Windows (Electron desktop app).
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Uses local fake AI servers only; no API keys or network access to providers.
      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build
