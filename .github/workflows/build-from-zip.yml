name: Build APK from ZIP

# Repo ke root mein sirf ALTREX-CODE-ROOT.zip rakho. Ye workflow usse unzip karke APK banata hai.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip the project
        run: |
          ls -la
          unzip -q ALTREX-CODE-ROOT.zip -d app
          ls -la app

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Test the mobile core
        working-directory: app
        run: pnpm --filter @altrex/desktop exec vitest run src/renderer/src/mobile

      - name: Build the web UI for the phone
        working-directory: app
        run: pnpm --filter @altrex/desktop build:mobile

      - name: Create and sync the Android project
        working-directory: app/apps/mobile
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Build the APK
        working-directory: app/apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ALTREX-CODE-android-apk
          path: app/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
